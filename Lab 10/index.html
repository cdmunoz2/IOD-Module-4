<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 10</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <style>
      .product-image {
        height: 200px;
        object-fit: contain;
        padding: 1rem;
      }

      .product-icon iconify-icon {
        font-size: 40px;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-light bg-light">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">E-Commerce Store</span>
        <input
          id="search-input"
          class="form-control"
          placeholder="Search Products..."
        />
        <select id="sort-select" class="form-select">
          <option value="">Sort By</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="title-az">Title: A to Z</option>
          <option value="title-za">Title: Z to A</option>
        </select>
      </div>
    </nav>

    <template id="product-template">
      <div class="col">
        <div class="card h-100">
          <img class="card-img-top product-image" alt="" />
          <div class="card-body">
            <div class="product-icon"></div>
            <h5 class="card-title product-title"></h5>
            <p class="card-text product-description"></p>
            <p class="fw-bold product-price"></p>
          </div>
        </div>
      </div>
    </template>

    <div class="container my-4">
      <div
        id="post-items"
        class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3"
      ></div>
    </div>

    <script>
      const postItems = document.querySelector("#post-items");
      const searchInput = document.querySelector("#search-input");
      const sortSelect = document.querySelector("#sort-select");

      let allProducts = [];

      function addProduct(product) {
        const template = document
          .getElementById("product-template")
          .content.cloneNode(true);

        const productIcon = template.querySelector(".product-icon");
        const category = product.category;
        if (category === "electronics") {
          productIcon.innerHTML =
            '<iconify-icon icon="map:electronics-store"></iconify-icon>';
        } else if (category === "jewelery") {
          productIcon.innerHTML =
            '<iconify-icon icon="uix-sharp:category-jewelry"></iconify-icon>';
        } else if (category === "men's clothing") {
          productIcon.innerHTML =
            '<iconify-icon icon="fa-solid:male"></iconify-icon>';
        } else if (category === "women's clothing") {
          productIcon.innerHTML =
            '<iconify-icon icon="fa-solid:female"></iconify-icon>';
        }

        template.querySelector(".product-image").src = product.image;
        template.querySelector(".product-title").innerText = product.title;
        template.querySelector(".product-description").innerText =
          product.description;
        template.querySelector(".product-price").innerText =
          "$" + product.price;
        postItems.appendChild(template);
      }

      function displayProducts() {
        let displayedProducts = allProducts.filter(function (product) {
          return (
            product.title
              .toLowerCase()
              .includes(searchInput.value.toLowerCase()) ||
            product.description
              .toLowerCase()
              .includes(searchInput.value.toLowerCase())
          );
        });

        const selectedSort = sortSelect.value;

        if (selectedSort === "price-low") {
          displayedProducts.sort(function (a, b) {
            return a.price - b.price;
          });
        } else if (selectedSort === "price-high") {
          displayedProducts.sort(function (a, b) {
            return b.price - a.price;
          });
        } else if (selectedSort === "title-az") {
          displayedProducts.sort(function (a, b) {
            return a.title.localeCompare(b.title);
          });
        } else if (selectedSort === "title-za") {
          displayedProducts.sort(function (a, b) {
            return b.title.localeCompare(a.title);
          });
        }

        postItems.innerHTML = "";

        displayedProducts.forEach(function (product) {
          addProduct(product);
        });
      }

      fetch("https://fakestoreapi.com/products")
        .then((response) => response.json())
        .then((products) => {
          allProducts = products;

          console.log(products);
          displayProducts();
        });

      searchInput.addEventListener("input", function () {
        displayProducts();
      });

      sortSelect.addEventListener("change", function () {
        displayProducts();
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
