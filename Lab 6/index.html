<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab #6 Fetch Posts</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <nav class="navbar bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand">Bootstrap Cards</a>
      </div>
    </nav>

    <template id="post-template">
      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title"></h5>
            <p class="card-text"></p>
          </div>
        </div>
      </div>
    </template>

    <div class="container my-4">
      <div
        id="post-list"
        class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3"
      ></div>
    </div>
    <script>
      const postList = document.querySelector("#post-list");

      function addPost(post) {
        const template = document
          .getElementById("post-template")
          .content.cloneNode(true);
        template.querySelector(".card-title").innerText = post.title;
        template.querySelector(".card-text").innerText = post.body;
        postList.appendChild(template);
      }

      function getPosts() {
        fetch("https://jsonplaceholder.typicode.com/posts?_limit=10")
          .then(function (response) {
            return response.json();
          })
          .then(function (posts) {
            postList.innerHTML = "";
            posts.forEach(function (post) {
              addPost(post);
            });
          })
          .catch(function (error) {
            console.log("Something went wrong:", error);
          });
      }

      getPosts();
    </script>
  </body>
</html>
