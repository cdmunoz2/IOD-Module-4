<!------------------------- Lab 8 Moment.js Dates Exercise ------------------------->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 8 Moment.js</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"
      integrity="sha512-iJIt5wigccZYA4F3G8kWt8H0r43JDWpvBweaGct6QsveuU4zmyP6VX2EXMfSfA/Z80b1PfHUNLioFfY1Z55cCg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-timezone@0.5/builds/moment-timezone-with-data.min.js"></script>
  </head>
  <body>
    <h2>Lab 8 - Moment.js Dates</h2>

    <p id="birthday-days-result"></p>
    <p id="birthday-ymd-result"></p>
    <p id="closest-result"></p>
    <p id="order-result"></p>
    <p id="london-time"></p>

    <script>
      const birthdate = moment("1990-01-02");
      const today = moment().startOf("day");
      const days = today.diff(birthdate, "days");
      const yearsPart = today.diff(birthdate, "years");
      const afterYears = birthdate.clone().add(yearsPart, "years");
      const monthsPart = today.diff(afterYears, "months");
      const afterMonths = afterYears.clone().add(monthsPart, "months");
      const daysPart = today.diff(afterMonths, "days");
      const londonTime = moment().tz("Europe/London");

      const dateA = moment("2000-01-01");
      const dateB = moment("2026-01-01");

      const distanceA = Math.abs(dateA.diff(today, "days"));
      const distanceB = Math.abs(dateB.diff(today, "days"));

      const closest = distanceA < distanceB ? dateA : dateB;

      const formatA = dateA.format("MMMM D, YYYY");
      const formatB = dateB.format("MMMM D, YYYY");

      let message;

      if (dateA < dateB) {
        message = `The first date is before the second date.`;
      } else if (dateA > dateB) {
        message = `The first date is after the second date.`;
      }

      document.querySelector("#birthday-days-result").innerText =
        `1) Number of days between my birthday and current date ${days.toLocaleString()} days.`;

      document.querySelector("#birthday-ymd-result").innerText =
        `2) Number of years, months and days from my birthday to current date: ${yearsPart} years, ${monthsPart} months, ${daysPart} days.`;

      document.querySelector("#closest-result").innerText =
        `3) Closest date to today between 1/1/2000 and 1/1/2026 is: ${closest.format("MMMM D, YYYY")}.`;

      document.querySelector("#order-result").innerText =
        `4) In comparing these 2 dates: 1/1/2000 and 1/1/2026. ${message}`;

      document.querySelector("#london-time").innerText =
        `5) The current time in London is ${londonTime.format("h:mm A")}.`;
    </script>
  </body>
</html>
